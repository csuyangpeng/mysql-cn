# Keepalived 主节点配置 (10.18.1.27)
# 复制到 /etc/keepalived/keepalived.conf
# 修改 interface、virtual_ipaddress、auth_pass

vrrp_script check_tidb {
    script "/etc/keepalived/check_tidb.sh"
    interval 3
    weight -20
    fall 2
    rise 1
}

vrrp_instance VI_TIDB {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass tidb123
    }
    virtual_ipaddress {
        10.18.1.100
    }
    track_script {
        check_tidb
    }
}
