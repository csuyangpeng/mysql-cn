# Keepalived 配置 - 主站点 10.18.1.27
# 部署路径：/etc/keepalived/keepalived.conf
#
# 关键点：
#   1. 两端都用 state BACKUP + nopreempt：主恢复后不抢回 VIP，避免来回漂移。
#   2. 组播在现网不可靠，使用 unicast_src_ip / unicast_peer。
#   3. track_script 不能配 weight：配了 weight 只会降低优先级，
#      在 nopreempt 下备节点不会接管；不配 weight 时脚本失败会进入 FAULT
#      并释放 VIP，备节点才能在主节点停止通告后接管。
#   4. interface 按实际网卡名填写（本环境为 ens3）。
#   5. keepalived 2.2+ 执行脚本需显式启用 enable_script_security。

global_defs {
    enable_script_security
    script_user root
}

vrrp_script check_tidb {
    script "/etc/keepalived/check_tidb.sh"
    interval 3
    timeout 2
    fall 2
    rise 1
}

vrrp_instance VI_TIDB {
    state BACKUP
    interface ens3
    virtual_router_id 51
    priority 100
    advert_int 1
    nopreempt

    unicast_src_ip 10.18.1.27
    unicast_peer {
        10.18.1.28
    }

    authentication {
        auth_type PASS
        auth_pass tidb123
    }

    virtual_ipaddress {
        10.18.1.100/24 dev ens3
    }

    track_script {
        check_tidb
    }

    notify_master "/etc/keepalived/notify.sh MASTER"
    notify_backup "/etc/keepalived/notify.sh BACKUP"
    notify_fault  "/etc/keepalived/notify.sh FAULT"
    notify_stop   "/etc/keepalived/notify.sh STOP"
}
