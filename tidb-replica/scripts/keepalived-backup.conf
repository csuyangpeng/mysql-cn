# Keepalived 备节点配置 (10.18.1.28)
# 复制到 /etc/keepalived/keepalived.conf
# 不抢占：主故障后 VIP 漂到备；主恢复后若希望 VIP 不漂回，将主 priority 改为 80

vrrp_script check_tidb {
    script "/etc/keepalived/check_tidb.sh"
    interval 3
    weight -20
    fall 2
    rise 1
}

vrrp_instance VI_TIDB {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 90
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass tidb123
    }
    virtual_ipaddress {
        10.18.1.100
    }
    track_script {
        check_tidb
    }
}
