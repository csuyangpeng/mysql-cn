# Keepalived 配置 - 备站点 10.18.1.28
# 部署路径：/etc/keepalived/keepalived.conf
#
# 与主站点配置的唯一区别：priority 90、unicast_src_ip/peer 对调。
# 两端均为 state BACKUP + nopreempt，优先级高者初始成为 MASTER；
# 主故障后 VIP 漂到备，主恢复后不抢回。

global_defs {
    enable_script_security
    script_user root
}

vrrp_script check_tidb {
    script "/etc/keepalived/check_tidb.sh"
    interval 3
    timeout 2
    fall 2
    rise 1
}

vrrp_instance VI_TIDB {
    state BACKUP
    interface ens3
    virtual_router_id 51
    priority 90
    advert_int 1
    nopreempt

    unicast_src_ip 10.18.1.28
    unicast_peer {
        10.18.1.27
    }

    authentication {
        auth_type PASS
        auth_pass tidb123
    }

    virtual_ipaddress {
        10.18.1.100/24 dev ens3
    }

    track_script {
        check_tidb
    }

    notify_master "/etc/keepalived/notify.sh MASTER"
    notify_backup "/etc/keepalived/notify.sh BACKUP"
    notify_fault  "/etc/keepalived/notify.sh FAULT"
    notify_stop   "/etc/keepalived/notify.sh STOP"
}
