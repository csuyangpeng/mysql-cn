services:
  polardb-x:
    build: .
    image: polardb-x:local
    container_name: polardb-x
    ports:
      - "13306:8527"
    environment:
      - POLARDBX_ROOT_PASSWORD=123456
    volumes:
      - ./data:/home/polarx/polardbx/build/run
      - ./init:/init:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    