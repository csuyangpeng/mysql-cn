# TiDB 标准形式：1 PD + 1 TiKV + 1 TiDB（真实 TiKV，支持 CommonHandle）
# tidb 使用本地 Dockerfile 启动：读取 TIDB_ROOT_PASSWORD，首启后在有标记前按文件名顺序执行 ./init/*.sql
# 标记：./data/tidb_entrypoint/.initdb_done；删除后可再次执行 /init

services:
  pd:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pingcap/pd:v8.5.0
    container_name: tidb-std-pd
    ports:
      - "32379:2379"
      - "32380:2380"
    volumes:
      - ./data/pd:/data
      - ./config/pd.toml:/etc/pd/pd.toml:ro
    command:
      - --name=pd1
      - --config=/etc/pd/pd.toml
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
    healthcheck:
      test: ["CMD", "/pd-ctl", "-u", "http://localhost:2379", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tidb-std

  tikv:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pingcap/tikv:v8.5.0
    container_name: tidb-std-tikv
    ports:
      - "20160:20160"
    volumes:
      - ./data/tikv:/data
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --data-dir=/data/tikv
      - --pd=pd:2379
    depends_on:
      pd:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tidb-std

  tidb:
    image: registry.cn-hangzhou.aliyuncs.com/10_18_1_2_5000/tidb:v8.5.0
    container_name: tidb-std-sql
    ports:
      - "13306:4000"
      - "10080:10080"
    environment:
      - TIDB_ROOT_PASSWORD=${TIDB_ROOT_PASSWORD:-123456}
    volumes:
      - ./init:/init:ro
      - ./data/tidb_entrypoint:/var/lib/tidb-entrypoint:rw
    command:
      - --store=tikv
      - --path=pd:2379
    depends_on:
      - tikv
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:10080/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tidb-std

networks:
  tidb-std:
    driver: bridge
