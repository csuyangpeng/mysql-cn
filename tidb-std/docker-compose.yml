# TiDB 标准形式：1 PD + 1 TiKV + 1 TiDB（真实 TiKV，支持 CommonHandle）
services:
  pd:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pingcap/pd:v8.5.0
    container_name: tidb-std-pd
    ports:
      - "32379:2379"
      - "32380:2380"
    volumes:
      - ./data/pd:/data
      - ./config/pd.toml:/etc/pd/pd.toml:ro
    command:
      - --name=pd1
      - --config=/etc/pd/pd.toml
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
    healthcheck:
      test: ["CMD", "/pd-ctl", "-u", "http://localhost:2379", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tidb-std

  tikv:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pingcap/tikv:v8.5.0
    container_name: tidb-std-tikv
    ports:
      - "20160:20160"
    volumes:
      - ./data/tikv:/data
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --data-dir=/data/tikv
      - --pd=pd:2379
    depends_on:
      pd:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tidb-std

  tidb:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pingcap/tidb:v8.5.0
    container_name: tidb-std-sql
    ports:
      - "13306:4000"
      - "10080:10080"
    environment:
      - TIDB_ROOT_PASSWORD=123456
    volumes:
      - ./init:/init:ro
    command:
      - --store=tikv
      - --path=pd:2379
    depends_on:
      - tikv
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:10080/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tidb-std

  tidb-init:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: tidb-std-init
    environment:
      - TIDB_HOST=tidb
      - TIDB_ROOT_PASSWORD=123456
    volumes:
      - ./init:/init:ro
      - ./init-cluster.sh:/scripts/init-cluster.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-cluster.sh"]
    depends_on:
      tidb:
        condition: service_healthy
    networks:
      - tidb-std
    restart: "no"

networks:
  tidb-std:
    driver: bridge
